name: Build Redmi AX5400 RA74 (NSS)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ra74-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ra74:
    name: Build Xiaomi Redmi AX5400 RA74 only
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      FORCE_UNSAFE_CONFIGURE: 1

    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev libzstd-dev \
            python3 python3-setuptools python3-dev python3-yaml python3-pyelftools \
            python3-requests rsync swig unzip zlib1g-dev file wget curl ccache \
            xsltproc zstd device-tree-compiler qemu-utils

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ra74-${{ runner.os }}-${{ hashFiles('.github/ci/ipq50xx/ra74.config', 'feeds.conf.default') }}-${{ github.sha }}
          restore-keys: |
            ra74-${{ runner.os }}-${{ hashFiles('.github/ci/ipq50xx/ra74.config', 'feeds.conf.default') }}-

      - name: Prepare RA74-only configuration
        run: cp .github/ci/ipq50xx/ra74.config .config

      - name: Add one-time RA74 wireless defaults
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-ra74-wireless <<'EOF'
          #!/bin/sh
          # Apply only once; OpenWrt removes successful uci-defaults scripts.
          # Verify the detected radio mapping before changing anything.
          [ "$(uci -q get wireless.radio0.band)" = "2g" ] || exit 1
          [ "$(uci -q get wireless.radio1.band)" = "5g" ] || exit 1

          uci set wireless.radio0.country='US'
          uci set wireless.radio0.txpower='25'

          uci set wireless.radio1.country='US'
          uci set wireless.radio1.channel='36'
          uci set wireless.radio1.htmode='HE160'
          uci set wireless.radio1.txpower='25'

          uci commit wireless
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/99-ra74-wireless

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Resolve and validate the single-device configuration
        shell: bash
        run: |
          set -euo pipefail
          make defconfig

          mapfile -t devices < <(grep -E '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_.*=y$' .config || true)
          if [[ "${#devices[@]}" -ne 1 || "${devices[0]}" != "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_redmi-ax5400=y" ]]; then
            echo "::error::The resolved config must select Redmi AX5400 RA74 and no other device."
            printf '%s\n' "${devices[@]}"
            exit 1
          fi

          if grep -q '^CONFIG_TARGET_MULTI_PROFILE=y' .config; then
            echo "::error::Multi-profile builds are not allowed."
            exit 1
          fi

          grep -q '^CONFIG_NSS_FIRMWARE_VERSION_12_5=y' .config
          ! grep -q '^CONFIG_NSS_FIRMWARE_VERSION_12_2=y' .config

          if grep -Eq '^CONFIG_(MAGIC_SYSRQ_SERIAL|DEVMEM)=y$' .config; then
            echo "::error::Temporary bring-up debug options are enabled; deployment build blocked."
            grep -E '^CONFIG_(MAGIC_SYSRQ_SERIAL|DEVMEM)=y$' .config
            exit 1
          fi

          grep -q '^CONFIG_PACKAGE_luci=m$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-nss=m$' .config
          grep -q '^CONFIG_LUCI_LANG_zh_Hans=y
          echo "Validated: RA74 only, NSS 12.5, LuCI Chinese."

          # This branch's IPQ5018 kernel config already enables TSENS,
          # CPU thermal throttling and the step_wise thermal governor.
          grep -q '^CONFIG_QCOM_TSENS=y

      - name: Clean ath11k/mac80211 conditional build
        run: make package/kernel/mac80211/clean

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Verify RA74 image and NSS firmware version
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_DIR="bin/targets/qualcommax/ipq50xx"
          test -d "$IMAGE_DIR"

          find "$IMAGE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
          mapfile -t images < <(find "$IMAGE_DIR" -maxdepth 1 -type f -name '*xiaomi_redmi-ax5400*squashfs-sysupgrade.bin' -print)
          if [[ "${#images[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one RA74 sysupgrade image; found ${#images[@]}."
            printf '%s\\n' "${images[@]}"
            exit 1
          fi
          IMAGE="${images[0]}"

          FWPKG="$(find bin -type f -name 'nss-firmware*.ipk' -print -quit)"
          if [[ -z "$FWPKG" ]]; then
            echo "::error::The nss-firmware package was not produced; cannot verify the firmware version."
            exit 1
          fi
          ar p "$FWPKG" data.tar.gz > /tmp/nss-firmware-data.tar.gz
          FW_PATH="$(tar -tzf /tmp/nss-firmware-data.tar.gz | grep -E '(^|/)qca-nss0-retail\\.bin$' | head -n1)"
          if [[ -z "$FW_PATH" ]]; then
            echo "::error::qca-nss0-retail.bin is missing from nss-firmware package."
            exit 1
          fi
          tar -xOzf /tmp/nss-firmware-data.tar.gz "$FW_PATH" | strings > /tmp/nss-fw-strings.txt
          grep -m1 -E 'NSS\\.FW\\.12\\.5-210' /tmp/nss-fw-strings.txt

          # Prepare a stable, human-readable Release asset name.
          mkdir -p release
          RELEASE_DATE="$(date -u +%Y%m%d)"
          RELEASE_TAG="ra74-nss12.5-${RELEASE_DATE}-run${GITHUB_RUN_NUMBER}"
          RELEASE_FILE="Redmi-AX5400-RA74-OpenWrt-NSS12.5-${RELEASE_DATE}-run${GITHUB_RUN_NUMBER}-sysupgrade.bin"
          cp "$IMAGE" "release/$RELEASE_FILE"
          sha256sum "release/$RELEASE_FILE" > "release/$RELEASE_FILE.sha256"
          cp "$IMAGE_DIR"/*.manifest release/ 2>/dev/null || true
          cp .config release/build.config
          printf 'Release tag: %s\\nSource commit: %s\\nNSS firmware: 12.5-210\\nDevice: Xiaomi Redmi AX5400 RA74\\n' "$RELEASE_TAG" "$GITHUB_SHA" > release/BUILD-INFO.txt
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=release/$RELEASE_FILE" >> "$GITHUB_ENV"
          sha256sum "$IMAGE"

      - name: Publish firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Redmi AX5400 RA74 — OpenWrt NSS 12.5 — Run ${{ github.run_number }}"
          body: |
            Xiaomi Redmi AX5400 (RA74) only.
            - NSS firmware: 12.5-210
            - 5 GHz default: channel 36, HE160
            - Country code: US
            - TX power setting: 25 dBm requested (actual output is regulatory/driver limited)
            - Built from commit: ${{ github.sha }}
            - This is a sysupgrade image for the existing OpenWrt installation; it is not a stock factory recovery image.
          files: |
            release/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload RA74 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX5400-RA74-NSS-${{ github.run_number }}
          path: |
            bin/targets/qualcommax/ipq50xx/
            build.log
          if-no-files-found: error
          retention-days: 14
 target/linux/qualcommax/config-6.18
          grep -q '^CONFIG_CPU_THERMAL=y

      - name: Clean ath11k/mac80211 conditional build
        run: make package/kernel/mac80211/clean

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Verify RA74 image and NSS firmware version
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_DIR="bin/targets/qualcommax/ipq50xx"
          test -d "$IMAGE_DIR"

          find "$IMAGE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
          IMAGE="$(find "$IMAGE_DIR" -maxdepth 1 -type f -name '*xiaomi_redmi-ax5400*squashfs-sysupgrade.bin' -print -quit)"
          if [[ -z "$IMAGE" ]]; then
            echo "::error::RA74 sysupgrade image was not produced."
            exit 1
          fi

          FW="$(find bin -type f -name 'qca-nss0-retail.bin' -print -quit)"
          if [[ -z "$FW" ]]; then
            FW="$(find bin -type f -name '*nss*firmware*.bin' -print -quit)"
          fi
          if [[ -n "$FW" ]]; then
            strings "$FW" > /tmp/nss-fw-strings.txt
            grep -m1 -E 'NSS\.FW\.12\.5-210' /tmp/nss-fw-strings.txt
          else
            echo "::warning::NSS firmware binary not found for direct version check."
          fi

          sha256sum "$IMAGE"

      - name: Upload RA74 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX5400-RA74-NSS-${{ github.run_number }}
          path: |
            bin/targets/qualcommax/ipq50xx/
            build.log
          if-no-files-found: error
          retention-days: 14
 target/linux/qualcommax/config-6.18
          grep -q '^CONFIG_CPU_FREQ_THERMAL=y

      - name: Clean ath11k/mac80211 conditional build
        run: make package/kernel/mac80211/clean

