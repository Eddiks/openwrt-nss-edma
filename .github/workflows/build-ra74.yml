name: Build Redmi AX5400 RA74 (NSS)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ra74-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ra74:
    name: Build Xiaomi Redmi AX5400 RA74 only
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      FORCE_UNSAFE_CONFIGURE: 1

    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev libzstd-dev \
            libgmp3-dev libmpc-dev libmpfr-dev \
            python3 python3-setuptools python3-dev python3-yaml python3-pyelftools \
            python3-requests rsync swig unzip zlib1g-dev file wget curl ccache \
            xsltproc zstd device-tree-compiler qemu-utils

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ra74-${{ runner.os }}-${{ hashFiles('.github/ci/ipq50xx/ra74.config', 'feeds.conf.default') }}-${{ github.sha }}
          restore-keys: |
            ra74-${{ runner.os }}-${{ hashFiles('.github/ci/ipq50xx/ra74.config', 'feeds.conf.default') }}-

      - name: Prepare RA74-only configuration
        run: cp .github/ci/ipq50xx/ra74.config .config

      - name: Add one-time RA74 wireless defaults
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-ra74-wireless <<'EOF'
          #!/bin/sh
          # Apply once only. The script is removed after successful execution.
          [ "$(uci -q get wireless.radio0.band)" = "2g" ] || exit 1
          [ "$(uci -q get wireless.radio1.band)" = "5g" ] || exit 1

          uci set wireless.radio0.country='US'
          uci set wireless.radio0.txpower='25'

          uci set wireless.radio1.country='US'
          uci set wireless.radio1.channel='36'
          uci set wireless.radio1.htmode='HE160'
          uci set wireless.radio1.txpower='25'

          uci commit wireless
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/99-ra74-wireless

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Resolve and validate the single-device configuration
        shell: bash
        run: |
          set -euo pipefail
          make defconfig

          mapfile -t devices < <(grep -E '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_.*=y$' .config || true)
          expected='CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_redmi-ax5400=y'
          if [[ "${#devices[@]}" -ne 1 || "${devices[0]}" != "$expected" ]]; then
            echo "::error::The resolved config must select Redmi AX5400 RA74 and no other device."
            printf '%s\n' "${devices[@]}"
            exit 1
          fi

          if grep -q '^CONFIG_TARGET_MULTI_PROFILE=y' .config; then
            echo "::error::Multi-profile builds are not allowed."
            exit 1
          fi

          grep -q '^CONFIG_TARGET_PER_DEVICE_ROOTFS=y$' .config
          grep -q '^CONFIG_ATH11K_MEM_PROFILE_1G=y$' .config
          grep -q '^CONFIG_NSS_MEM_PROFILE_MEDIUM=y$' .config
          grep -q '^CONFIG_NSS_FIRMWARE_VERSION_12_5=y$' .config
          ! grep -q '^CONFIG_NSS_FIRMWARE_VERSION_12_2=y$' .config

          grep -q '^CONFIG_PACKAGE_luci=m$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-nss=m$' .config
          grep -q '^CONFIG_LUCI_LANG_zh_Hans=y$' .config

          if grep -Eq '^CONFIG_(MAGIC_SYSRQ_SERIAL|DEVMEM)=y$' .config; then
            echo "::error::Temporary bring-up debug options are enabled; deployment build blocked."
            grep -E '^CONFIG_(MAGIC_SYSRQ_SERIAL|DEVMEM)=y$' .config
            exit 1
          fi

          # Verify the checked-in IPQ5018 kernel config retains thermal support.
          grep -q '^CONFIG_QCOM_TSENS=y$' target/linux/qualcommax/config-6.18
          grep -q '^CONFIG_CPU_THERMAL=y$' target/linux/qualcommax/config-6.18
          grep -q '^CONFIG_CPU_FREQ_THERMAL=y$' target/linux/qualcommax/config-6.18
          grep -q '^CONFIG_THERMAL_DEFAULT_GOV_STEP_WISE=y$' target/linux/qualcommax/config-6.18
          grep -q '^CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          echo "Validated: RA74 only, NSS 12.5, LuCI Chinese, TSENS and CPU thermal support."

      - name: Clean ath11k/mac80211 conditional build
        run: make package/kernel/mac80211/clean

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Verify RA74 image, NSS firmware, and thermal device tree
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_DIR="bin/targets/qualcommax/ipq50xx"
          test -d "$IMAGE_DIR"
          find "$IMAGE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

          mapfile -t images < <(find "$IMAGE_DIR" -maxdepth 1 -type f -name '*xiaomi_redmi-ax5400*squashfs-sysupgrade.bin' -print)
          if [[ "${#images[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one RA74 sysupgrade image; found ${#images[@]}."
            printf '%s\n' "${images[@]}"
            exit 1
          fi
          IMAGE="${images[0]}"

          # Verify the NSS firmware inside the actual firmware package, not merely .config.
          FWPKG="$(find bin -type f -name 'nss-firmware*.ipk' -print -quit)"
          if [[ -z "$FWPKG" ]]; then
            echo "::error::The nss-firmware package was not produced."
            exit 1
          fi
          ar p "$FWPKG" data.tar.gz > /tmp/nss-firmware-data.tar.gz
          FW_PATH="$(tar -tzf /tmp/nss-firmware-data.tar.gz | grep -E '(^|/)qca-nss0-retail\.bin$' | sed -n '1p')"
          if [[ -z "$FW_PATH" ]]; then
            echo "::error::qca-nss0-retail.bin is missing from nss-firmware package."
            exit 1
          fi
          tar -xOzf /tmp/nss-firmware-data.tar.gz "$FW_PATH" | strings > /tmp/nss-fw-strings.txt
          grep -m1 -E 'NSS\.FW\.12\.5-210' /tmp/nss-fw-strings.txt

          # The compiled board DTB must contain the CPU thermal zone.
          DTB="$(find build_dir -type f -name 'image-ipq5018-redmi-ax5400.dtb' -print -quit)"
          if [[ -z "$DTB" ]]; then
            echo "::error::RA74 device tree blob was not found."
            exit 1
          fi
          dtc -I dtb -O dts "$DTB" > /tmp/ra74-device-tree.dts
          grep -q 'cpu-thermal' /tmp/ra74-device-tree.dts
          grep -q 'thermal-sensor' /tmp/ra74-device-tree.dts

          # Keep the upstream sysupgrade filename; do not disguise it as a factory image.
          mkdir -p release
          cp "$IMAGE" release/
          sha256sum "release/$(basename "$IMAGE")" > "release/$(basename "$IMAGE").sha256"
          cp "$IMAGE_DIR"/*.manifest release/ 2>/dev/null || true
          cp .config release/config.buildinfo
          printf 'Device: Xiaomi Redmi AX5400 RA74\nTarget: qualcommax/ipq50xx\nNSS firmware: 12.5-210\nCountry: US\n5 GHz: channel 36, HE160\nTX power request: 25 dBm (subject to regulatory and driver limits)\nThermal: QCOM TSENS + CPU thermal governor enabled\nSource commit: %s\n' "$GITHUB_SHA" > release/BUILD-INFO.txt

          RELEASE_DATE="$(date -u +%Y.%m.%d)"
          RELEASE_TAG="ipq50xx-${RELEASE_DATE}-ra74-run${GITHUB_RUN_NUMBER}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          sha256sum "$IMAGE"

      - name: Publish firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Redmi AX5400 RA74 — NSS 12.5 — ${{ env.RELEASE_TAG }}"
          body: |
            Xiaomi Redmi AX5400 (RA74) only.
            - NSS firmware: 12.5-210
            - 5 GHz default: channel 36, HE160 (DFS may apply to the full 160 MHz block)
            - Country code: US
            - TX power setting: 25 dBm requested; actual output is limited by regulatory domain and driver
            - CPU thermal monitoring and thermal throttling support are enabled
            - Built from commit: ${{ github.sha }}
            - Sysupgrade image only; not a stock factory/recovery image.
          files: |
            release/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload RA74 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX5400-RA74-NSS-${{ github.run_number }}
          path: |
            bin/targets/qualcommax/ipq50xx/
            build.log
          if-no-files-found: error
          retention-days: 14
 target/linux/qualcommax/config-6.18
          grep -q '^CONFIG_ATH11K_THERMAL=y
          echo "Validated: RA74 only, NSS 12.5, LuCI Chinese, TSENS and CPU thermal support."

      - name: Clean ath11k/mac80211 conditional build
        run: make package/kernel/mac80211/clean

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Verify RA74 image, NSS firmware, and thermal device tree
        shell: bash
        run: |
          set -euo pipefail

