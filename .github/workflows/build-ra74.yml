          if [[ -n "$FW" ]]; then
            strings "$FW" > /tmp/nss-fw-strings.txt
            grep -m1 -E 'NSS\.FW\.12\.5-210' /tmp/nss-fw-strings.txt
          else
            echo "::warning::NSS firmware binary not found for direct version check."
          fi

          sha256sum "$IMAGE"

      - name: Upload RA74 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX5400-RA74-NSS-${{ github.run_number }}
          path: |
            bin/targets/qualcommax/ipq50xx/
            build.log
          if-no-files-found: error
          retention-days: 14
