      - name: Publish firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Redmi AX5400 RA74 — NSS 12.5 — ${{ env.RELEASE_TAG }}"
          body: |
            Xiaomi Redmi AX5400 (RA74) only.
            - NSS firmware: 12.5-210
            - Switch topology: upstream DSA / tag_8021q; conduit and GMAC mask detected at boot
            - Wi-Fi NSS offload: DSA first-boot default enabled (unless overridden in UCI)
