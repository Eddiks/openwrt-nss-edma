name: Build Redmi AX5400 RA74 (NSS)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ra74-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ra74:
    name: Build Xiaomi Redmi AX5400 RA74 only
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      FORCE_UNSAFE_CONFIGURE: 1

    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev libzstd-dev \
            libgmp3-dev libmpc-dev libmpfr-dev \
            python3 python3-setuptools python3-dev python3-yaml python3-pyelftools \
            python3-requests rsync swig unzip zlib1g-dev file wget curl ccache \
            xsltproc zstd device-tree-compiler qemu-utils

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ra74-${{ runner.os }}-${{ hashFiles('.github/ci/ipq50xx/ra74.config', 'feeds.conf.default') }}-${{ github.sha }}
          restore-keys: |
            ra74-${{ runner.os }}-${{ hashFiles('.github/ci/ipq50xx/ra74.config', 'feeds.conf.default') }}-

      - name: Prepare RA74-only configuration
        run: cp .github/ci/ipq50xx/ra74.config .config

      - name: Add one-time RA74 wireless defaults
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-ra74-wireless <<'EOF'
          #!/bin/sh
          # Apply once only. The script is removed after successful execution.
          [ "$(uci -q get wireless.radio0.band)" = "2g" ] || exit 1
          [ "$(uci -q get wireless.radio1.band)" = "5g" ] || exit 1

          uci set wireless.radio0.country='US'
          uci set wireless.radio0.txpower='25'

          uci set wireless.radio1.country='US'
          uci set wireless.radio1.channel='36'
          uci set wireless.radio1.htmode='HE160'
          uci set wireless.radio1.txpower='25'

          uci commit wireless
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/99-ra74-wireless

      - name: Update feeds and install only RA74 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          make prepare-tmpinfo

          # Install only packages explicitly selected by the RA74 config plus
          # packages listed by the RA74 device profile. scripts/feeds resolves
          # their recursive build/runtime dependencies. Installing every source
          # package in every feed parses unrelated Kconfig entries (Qt5, fwknop,
          # squeezelite) that are not part of this firmware.
          mapfile -t feed_packages < <(python3 - <<'PY'
          import re
          from pathlib import Path

          config = Path(".github/ci/ipq50xx/ra74.config").read_text()
          selected = set()
          for name, value in re.findall(r"^CONFIG_PACKAGE_([A-Za-z0-9_+-]+)=(y|m)$", config, re.M):
              selected.add(name)

          targetinfo = Path("tmp/.targetinfo").read_text()
          blocks = re.split(r"(?m)^Target-Profile:\s*", targetinfo)
          profile = "DEVICE_xiaomi_redmi-ax5400"
          found = False
          for block in blocks[1:]:
              name = block.splitlines()[0].strip()
              if name != profile:
                  continue
              found = True
              match = re.search(r"(?m)^Target-Profile-Packages:(.*)$", block)
              if match:
                  selected.update(pkg.lstrip("-") for pkg in match.group(1).split() if not pkg.startswith("-"))
              break

          if not found:
              raise SystemExit(f"RA74 device profile {profile} not found in tmp/.targetinfo")

          # nss-tools-dwmac is a local package, so its feed dependency is not
          # represented by CONFIG_PACKAGE_* in ra74.config or DEVICE_PACKAGES.
          # The NSS feed source directory is qca-nss-ecm (it provides
          # kmod-qca-nss-ecm), not the generated kernel package name.
          selected.add("qca-nss-ecm")

          for name in sorted(selected):
              print(name)
          PY
          )

          printf 'Installing %s selected/feed device packages:\n' "${#feed_packages[@]}"
          printf '  %s\n' "${feed_packages[@]}"
          if (( ${#feed_packages[@]} )); then
            ./scripts/feeds install "${feed_packages[@]}"
          fi

          # Fail here, with a precise diagnostic, if the NSS ECM feed source
          # was not linked into the build tree.
          test -f package/feeds/nss/qca-nss-ecm/Makefile || {
            echo "::error::NSS feed package qca-nss-ecm was not installed; nss-tools-dwmac requires kmod-qca-nss-ecm."
            exit 1
          }

      - name: Resolve and validate the single-device configuration
        shell: bash
        run: |
          set -euo pipefail
          make defconfig

          # Match the upstream workflow: every explicit RA74 config request
          # must survive Kconfig resolution, not merely the subset checked below.
          dropped=()
          while IFS= read -r req; do
            grep -qxF "$req" .config || dropped+=("$req")
          done < <(grep -E '^CONFIG_[A-Za-z0-9_-]+=' .github/ci/ipq50xx/ra74.config | sort -u)
          if (( ${#dropped[@]} )); then
            echo "::error::make defconfig dropped required RA74 config entries:"
            printf '  %s\n' "${dropped[@]}"
            exit 1
          fi

          mapfile -t devices < <(grep '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_.*=y' .config || true)
          expected='CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_redmi-ax5400=y'
          if (( ${#devices[@]} != 1 )) || [[ "${devices[0]}" != "$expected" ]]; then
            echo "::error::The resolved config must select Redmi AX5400 RA74 and no other device."
            printf '%s\n' "${devices[@]}"
            exit 1
          fi

          if grep -Fqx 'CONFIG_TARGET_MULTI_PROFILE=y' .config; then
            echo "::error::Multi-profile builds are not allowed."
            exit 1
          fi

          grep -Fqx 'CONFIG_ATH11K_MEM_PROFILE_1G=y' .config
          grep -Fqx 'CONFIG_NSS_MEM_PROFILE_MEDIUM=y' .config
          grep -Fqx 'CONFIG_NSS_FIRMWARE_VERSION_12_5=y' .config
          grep -Fqx 'CONFIG_PACKAGE_nss-tools-dwmac=y' .config
          grep -Fqx 'CONFIG_PACKAGE_nss-firmware=y' .config
          grep -Fqx 'CONFIG_NSS_DRV_VLAN_ENABLE=y' .config
          grep -Fqx 'CONFIG_NSS_DRV_IPV6_ENABLE=y' .config
          grep -Fqx 'CONFIG_NSS_DRV_PPPOE_ENABLE=y' .config
          grep -Fqx 'CONFIG_NSS_DRV_VIRT_IF_ENABLE=y' .config
          grep -Fqx 'CONFIG_ATH11K_NSS_SUPPORT=y' .config
          grep -Fqx 'CONFIG_NSS_DRV_WIFIOFFLOAD_ENABLE=y' .config
          grep -Fqx 'CONFIG_NSS_DRV_WIFI_EXT_VDEV_ENABLE=y' .config
          grep -Fqx 'CONFIG_NSS_DRV_SHAPER_ENABLE=y' .config
          grep -Fqx 'CONFIG_NSS_DRV_IGS_ENABLE=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-qca-nss-drv-netlink=y' .config
          grep -Fqx 'CONFIG_PACKAGE_sqm-scripts-nss=y' .config
          ! grep -Fqx 'CONFIG_NSS_FIRMWARE_VERSION_12_2=y' .config

          grep -Fqx 'CONFIG_PACKAGE_luci-app-nss=m' .config
          grep -Fqx 'CONFIG_LUCI_LANG_zh_Hans=y' .config
          grep -Fqx 'CONFIG_ATH11K_THERMAL=y' .config

          # 802.11v requires the full WNM-enabled wpad build.
          grep -Fqx 'CONFIG_PACKAGE_wpad-mbedtls=y' .config
          if grep -Eq '^CONFIG_PACKAGE_wpad-basic-mbedtls=(y|m)
          if grep -Fqx 'CONFIG_MAGIC_SYSRQ_SERIAL=y' .config || grep -Fqx 'CONFIG_DEVMEM=y' .config; then
            echo "::error::Temporary bring-up debug options are enabled; deployment build blocked."
            exit 1
          fi

          # Verify the checked-in IPQ5018 kernel config retains thermal support.
          grep -Fqx 'CONFIG_QCOM_TSENS=y' target/linux/qualcommax/config-6.18
          grep -Fqx 'CONFIG_CPU_THERMAL=y' target/linux/qualcommax/config-6.18
          grep -Fqx 'CONFIG_CPU_FREQ_THERMAL=y' target/linux/qualcommax/config-6.18
          grep -Fqx 'CONFIG_THERMAL_DEFAULT_GOV_STEP_WISE=y' target/linux/qualcommax/config-6.18
          grep -Fqx 'CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y' target/linux/qualcommax/config-6.18

          echo "Validated: RA74 only, NSS 12.5, LuCI Chinese, ath11k and CPU thermal support."

      - name: Clean ath11k/mac80211 conditional build
        run: make package/kernel/mac80211/clean

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Diagnose NSS firmware APK
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG="$RUNNER_TEMP/ra74-apk-diagnostic.log"
          exec > >(tee -a "$LOG") 2>&1

          echo "===== Build information ====="
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "RUN_NUMBER=$GITHUB_RUN_NUMBER"

          echo "===== APK tool ====="
          APK_TOOL="staging_dir/host/bin/apk"

          if [[ ! -x "$APK_TOOL" ]]; then
            echo "::error::APK tool not found: $APK_TOOL"
            exit 1
          fi

          "$APK_TOOL" --version

          echo "===== APK tool extract help ====="
          "$APK_TOOL" extract --help

          echo "===== Firmware package ====="
          FWPKG="$(find bin -type f -name 'nss-firmware-ipq50xx*.apk' -print -quit)"

          if [[ -z "$FWPKG" ]]; then
            echo "::error::Firmware APK not found"
            exit 1
          fi

          echo "FWPKG=$FWPKG"
          ls -lh "$FWPKG"
          sha256sum "$FWPKG"
          file "$FWPKG"

          echo "===== Extract APK ====="
          APK_ROOT="$RUNNER_TEMP/nss-firmware-apk"
          rm -rf "$APK_ROOT"
          mkdir -p "$APK_ROOT"

          "$APK_TOOL" --allow-untrusted extract \
            --no-chown \
            --destination "$APK_ROOT" \
            "$FWPKG"

          echo "===== Extracted files ====="
          find "$APK_ROOT" -type f -printf '%p %s bytes\n'

          FW_BIN="$APK_ROOT/lib/firmware/qca-nss0-retail.bin"

          if [[ ! -s "$FW_BIN" ]]; then
            echo "::error::Firmware binary missing or empty"
            exit 1
          fi

          echo "===== Firmware version ====="
          strings "$FW_BIN" | grep -F 'NSS.FW.12.5-210'

          echo "===== Diagnostic completed ====="

      - name: Upload NSS diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra74-apk-diagnostic-${{ github.run_number }}
          path: ${{ runner.temp }}/ra74-apk-diagnostic.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify NSS runtime packages, Wi-Fi default, and RA74 DSA path
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_DIR="bin/targets/qualcommax/ipq50xx"
          MANIFEST="$(find "$IMAGE_DIR" -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          if [[ -z "$MANIFEST" ]]; then
            echo "::error::The RA74 package manifest was not produced."
            exit 1
          fi

          # These must be present in the final image, not merely selected
          # in .config. nss-tools-dwmac pulls in the IPQ50xx wired stack;
          # PPPoE and netlink are selected explicitly by the RA74 config.
          required_packages=(
            nss-tools-dwmac
            luci-app-nss
            luci-i18n-nss-zh-cn
            wpad-mbedtls
            hostapd-common
            libmbedtls
            nss-firmware
            nss-firmware-ipq50xx
            kmod-qca-dwmac-nss
            kmod-qca-nss-drv
            kmod-qca-nss-ecm
            kmod-qca-nss-drv-vlan-mgr
            kmod-qca-dsa-nss
            kmod-qca8337-nss
            kmod-qca-nss-drv-pppoe
            kmod-qca-nss-drv-netlink
            kmod-ppp
            kmod-pppoe
          )
          for pkg in "${required_packages[@]}"; do
            if ! grep -Eq "^${pkg}[[:space:]]+-" "$MANIFEST"; then
              echo "::error::Required package missing from final image manifest: $pkg"
              exit 1
            fi
            echo "Manifest OK: $pkg"
          done

          if grep -Eq '^wpad-basic-mbedtls[[:space:]]+-' "$MANIFEST"; then
            echo "::error::Basic wpad variant is forbidden; it lacks CONFIG_WNM for 802.11v."
            exit 1
          fi

          # Confirm that the compiled hostapd configuration used by the full
          # mbedTLS variant really contains WNM support, not just a selected package name.
          mapfile -t hostapd_configs < <(find build_dir -type f -path '*/hostapd/.config' -print)
          if (( ${#hostapd_configs[@]} == 0 )); then
            echo "::error::Compiled hostapd .config was not found; cannot verify 802.11v support."
            exit 1
          fi
          wnm_config_found=0
          for cfg in "${hostapd_configs[@]}"; do
            if grep -Fqx 'CONFIG_WNM=y' "$cfg"; then
              wnm_config_found=1
              echo "802.11v build config OK: $cfg"
            fi
          done
          if (( wnm_config_found == 0 )); then
            echo "::error::No compiled hostapd configuration has CONFIG_WNM=y."
            exit 1
          fi


          # Inspect the actual target rootfs for the runtime scripts installed
          # by nss-tools-dwmac (paths verified against its package Makefile).
          ROOTFS="$(find build_dir/target-* -maxdepth 2 -type d -name 'root-*' -print -quit)"
          if [[ -z "$ROOTFS" ]]; then
            echo "::error::Could not locate the built target rootfs."
            exit 1
          fi

          # Verify the NSS LuCI application is actually installed in the
          # RA74 rootfs, not merely selected or built as an optional package.
          for file in \
            usr/share/luci/menu.d/luci-app-nss.json \
            usr/share/rpcd/acl.d/luci-app-nss.json \
            www/luci-static/resources/view/nss/status.js; do
            if [[ ! -s "$ROOTFS/$file" ]]; then
              echo "::error::NSS LuCI application file missing from rootfs: $file"
              exit 1
            fi
            echo "NSS LuCI file OK: $file"
          done
          if ! grep -Fq 'admin/status/nss' "$ROOTFS/usr/share/luci/menu.d/luci-app-nss.json"; then
            echo "::error::NSS LuCI menu entry admin/status/nss is missing."
            exit 1
          fi
          if ! find "$ROOTFS/usr/lib/lua/luci/i18n" "$ROOTFS/usr/share" -type f -iname '*nss*zh*' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Simplified Chinese NSS LuCI translation was not found in the rootfs."
            exit 1
          fi

          # Verify the actual wpad binary shipped in the image recognizes the
          # 802.11v BSS Transition Management option. This catches a mismatch
          # between the selected package, generated hostapd config and binary.
          WPAD_BIN="$ROOTFS/usr/sbin/wpad"
          if [[ ! -x "$WPAD_BIN" ]]; then
            echo "::error::Full wpad binary is missing from the target rootfs."
            exit 1
          fi
          strings "$WPAD_BIN" > "$RUNNER_TEMP/ra74-wpad.strings"
          if ! grep -Fqx 'bss_transition' "$RUNNER_TEMP/ra74-wpad.strings"; then
            echo "::error::The shipped wpad binary does not contain bss_transition; 802.11v WNM support is not verified."
            exit 1
          fi
          echo "802.11v runtime binary OK: wpad contains bss_transition"

          for file in \
            etc/init.d/nss \
            usr/sbin/nss-dwmac-up \
            usr/sbin/nss-dwmac-probe \
            usr/sbin/nss-status \
            lib/nss/functions.sh \
            etc/uci-defaults/98-nss-offload \
            etc/uci-defaults/99-nss-topology; do
            test -s "$ROOTFS/$file" || {
              echo "::error::NSS runtime file missing from target rootfs: $file"
              exit 1
            }
            echo "Rootfs OK: $file"
          done

          # Confirm that the RA74 DTS exposes both GMACs and the QCA8337's
          # two CPU links: port 5 -> GMAC0 (PHY-to-PHY WAN link), port 6 -> GMAC1 (SGMII).
          DTS="target/linux/qualcommax/dts/ipq5018-redmi-ax5400.dts"
          grep -Fqx '#include "ipq5018-nss.dtsi"' "$DTS"
          grep -A8 '^&gmac0 {' "$DTS" | grep -Fq 'status = "okay";'
          grep -A12 '^&gmac1 {' "$DTS" | grep -Fq 'status = "okay";'
          grep -Fq 'compatible = "qca,qca8337";' "$DTS"
          grep -A8 'ethernet-port@5 {' "$DTS" | grep -Fq 'ethernet = <&gmac0>;'
          grep -A10 'ethernet-port@6 {' "$DTS" | grep -Fq 'ethernet = <&gmac1>;'
          grep -Fq 'qca,sgmii-enable-pll;' "$DTS"

          # The stock board network map initially splits the DSA ports:
          # LAN1-3 on eth1 and WAN on eth0. The DSA defaults must reconcile
          # that split instead of hard-coding a fw_mask for the two GMACs.
          BOARD_NET="target/linux/qualcommax/ipq50xx/base-files/etc/board.d/02_network"
          for line in \
            'ucidef_set_network_device_conduit "lan1" "eth1"' \
            'ucidef_set_network_device_conduit "lan2" "eth1"' \
            'ucidef_set_network_device_conduit "lan3" "eth1"' \
            'ucidef_set_network_device_conduit "wan" "eth0"'; do
            grep -Fq "$line" "$BOARD_NET" || {
              echo "::error::RA74 board DSA conduit mapping missing: $line"
              exit 1
            }
          done

          DEFAULTS="package/nss/nss-tools/files/nss-dwmac.defaults"
          INIT="package/nss/nss-tools/files/nss-dwmac.init"
          UP="package/nss/nss-tools/files/nss-dwmac-up"
          FUNCS="package/nss/nss-tools/files/functions.sh"

          # Require the upstream C-3PO DSA path: retain the DSA switch,
          # select topology=dsa, turn Wi-Fi offload on by default if unset,
          # and merge the RA74 split conduits based on the actual board map.
          grep -Fq 'if c3po_switch_bound; then' "$DEFAULTS"
          grep -Fq "uci set nss.general.topology='dsa'" "$DEFAULTS"
          grep -Fq "uci set nss.general.wifi_offload='1'" "$DEFAULTS"
          grep -Fq 'dsa_board_conduits' "$DEFAULTS"
          grep -Fq 'main_conduit' "$DEFAULTS"
          grep -Fq 'if [ "$topology" = "dsa" ]; then' "$INIT"
          grep -Fq 'switch_to_8021q' "$INIT"
          grep -Fq 'nss_gmac_netdevs' "$INIT"
          grep -Fq 'ifmap="$ifmap"' "$INIT"
          grep -Fq 'nss_dsa_conduit' "$FUNCS"
          grep -Fq 'nss_dsa_fw_mask' "$UP"
          grep -Fq 'echo "$MASK" > $FWM' "$UP"

          # Require correct sequencing: arm first, then ath11k/Wi-Fi and
          # firmware VLAN / DSA managers / ECM / PPPoE managers.
          grep -Fq 'poll_until 15 fw_started' "$UP"
          grep -Fq 'wifi_load_now 1' "$UP"
          grep -Fq 'modprobe qca-nss-vlan' "$UP"
          grep -Fq 'modprobe qca-nss-pppoe' "$UP"
          grep -Fq 'modprobe qca-dsa-nss' "$UP"
          grep -Fq 'modprobe ecm front_end_selection=1' "$UP"
          grep -Fq 'modprobe ath11k' "$INIT"
          # The current init script writes the module parameter from wifi_load()
          # using its local "offload" argument, not start_service's
          # "wifi_offload" variable. With offload=1 it defers ath11k until
          # nss-dwmac-up has armed the NSS firmware.
          grep -Fq 'echo "$offload" > $NSSOFF' "$INIT"
          grep -Fq 'deferring ath11k to nss-dwmac-up' "$INIT"

          echo "Validated: NSS package manifest, runtime files, RA74 dual-GMAC DTS, DSA conduit migration, dynamic fw_mask, Wi-Fi offload default=1, VLAN/PPPoE/DSA managers and ECM sequencing."

      - name: Verify RA74 image, NSS firmware, and thermal device tree
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_DIR="bin/targets/qualcommax/ipq50xx"
          test -d "$IMAGE_DIR"
          find "$IMAGE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

          mapfile -t images < <(find "$IMAGE_DIR" -maxdepth 1 -type f -name '*xiaomi_redmi-ax5400*squashfs-sysupgrade.bin' -print)
          if (( ${#images[@]} != 1 )); then
            echo "::error::Expected exactly one RA74 sysupgrade image; found ${#images[@]}."
            printf '%s\n' "${images[@]}"
            exit 1
          fi
          IMAGE="${images[0]}"

          # Verify the NSS firmware inside the actual firmware package.
          FWPKG="$(find bin -type f \( \
            -name 'nss-firmware-ipq50xx*.ipk' -o \
            -name 'nss-firmware-ipq50xx*.apk' \
          \) -print -quit)"
          if [[ -z "$FWPKG" ]]; then
            echo "::error::The nss-firmware package was not produced."
            exit 1
          fi
          case "$FWPKG" in
            *.ipk)
              ar p "$FWPKG" data.tar.gz > /tmp/nss-firmware-data.tar.gz
              FW_PATH="$(tar -tzf /tmp/nss-firmware-data.tar.gz | grep -F 'qca-nss0-retail.bin' | sed -n '1p')"
              if [[ -z "$FW_PATH" ]]; then
                echo "::error::qca-nss0-retail.bin is missing from $FWPKG."
                exit 1
              fi
              tar -xOzf /tmp/nss-firmware-data.tar.gz "$FW_PATH" | strings > /tmp/nss-fw-strings.txt
              ;;
            *.apk)
              # OpenWrt builds APK packages with apk-tools (package-pack.mk).
              # Use the matching host apk binary; .apk is not a plain tar.gz.
              APK_TOOL="staging_dir/host/bin/apk"
              if [[ ! -x "$APK_TOOL" ]]; then
                echo "::error::OpenWrt host apk tool not found: $APK_TOOL"
                exit 1
              fi
              APK_ROOT="/tmp/nss-firmware-apk"
              rm -rf "$APK_ROOT"
              mkdir -p "$APK_ROOT"
              "$APK_TOOL" --allow-untrusted extract --no-chown --destination "$APK_ROOT" "$FWPKG"
              FW_BIN="$APK_ROOT/lib/firmware/qca-nss0-retail.bin"
              if [[ ! -s "$FW_BIN" ]]; then
                echo "::error::qca-nss0-retail.bin is missing from $FWPKG."
                exit 1
              fi
              strings "$FW_BIN" > /tmp/nss-fw-strings.txt
              ;;
            *) echo "::error::Unsupported package format: $FWPKG"; exit 1 ;;
          esac
          grep -F 'NSS.FW.12.5-210' /tmp/nss-fw-strings.txt

          # Verify the compiled board DTB contains the CPU thermal zone.
          DTB="$(find build_dir -type f -name 'image-ipq5018-redmi-ax5400.dtb' -print -quit)"
          if [[ -z "$DTB" ]]; then
            echo "::error::RA74 device tree blob was not found."
            exit 1
          fi
          dtc -I dtb -O dts "$DTB" > /tmp/ra74-device-tree.dts
          grep -F 'cpu-thermal' /tmp/ra74-device-tree.dts
          grep -F 'thermal-sensor' /tmp/ra74-device-tree.dts
          grep -F 'cpu-passive' /tmp/ra74-device-tree.dts
          grep -F 'cooling-device' /tmp/ra74-device-tree.dts

          # Preserve the upstream OpenWrt sysupgrade filename.
          mkdir -p release
          cp "$IMAGE" release/
          sha256sum "release/$(basename "$IMAGE")" > "release/$(basename "$IMAGE").sha256"
          cp "$IMAGE_DIR"/*.manifest release/ 2>/dev/null || true
          cp .config release/config.buildinfo
          cp feeds.conf.default release/feeds.conf.default
          {
            echo "Device: Xiaomi Redmi AX5400 RA74"
            echo "Target: qualcommax/ipq50xx"
            echo "NSS firmware: 12.5-210"
            echo "Switch topology: upstream DSA (tag_8021q), runtime conduit/fw_mask detection"
            echo "Wi-Fi NSS offload: enabled by DSA first-boot default when unset (nss.general.wifi_offload=1)"
            echo "Country: US"
